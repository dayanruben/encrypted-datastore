name: Publish

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dayanruben/encrypted-datastore'
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          versions = tomllib.loads(Path("gradle/libs.versions.toml").read_text())["versions"]
          expected = versions["androidx-datastore"] + "-" + versions["encrypted-datastore"]
          tag = os.environ.get("RELEASE_TAG")
          if tag and tag != expected:
              raise SystemExit(f"Release tag {tag} does not match library version {expected}")
          print(f"Publishing {expected}")
          PY

      - name: Check
        run: ./gradlew check :sample:assembleDebug

      - name: Upload Artifacts
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
