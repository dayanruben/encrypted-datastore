name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup JDK
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Check
        run: ./gradlew check :sample:assembleDebug :security-crypto-datastore:assembleRelease :security-crypto-datastore-preferences:assembleRelease
